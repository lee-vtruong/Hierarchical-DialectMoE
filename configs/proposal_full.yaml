seed: 42

data:
  dataset_name: nguyendv02/ViMD_Dataset
  local_dir: data/ViMD_Dataset
  cache_dir: data/huggingface
  audio_column: audio
  text_column: text
  region_column: region
  province_column: province_code
  province_name_column: province_name
  gender_column: gender
  speaker_column: speakerID
  sample_rate: 16000
  max_seconds: 20.0
  num_workers: 4

model:
  backbone: facebook/wav2vec2-base
  freeze_feature_encoder: true
  freeze_backbone: false
  gradient_checkpointing: true
  acoustic_dim: 256
  prosody_dim: 128
  fusion_dim: 384
  dropout: 0.2

  prosody:
    representation: sequence
    encoder: transformer
    features:
      - f0
      - energy
      - jitter
      - shimmer
      - pause
      - formant_f1
      - formant_f2
      - formant_f3
    sequence_hidden_dim: 128
    sequence_layers: 2
    sequence_heads: 4

  fusion:
    type: gated

  router:
    hierarchy: [region, subregion, expert]
    input: acoustic_prosody
    mode: soft
    temperature: 1.0

  moe:
    num_experts: 8
    top_k: 2
    expert_hidden_dim: 512
    expert_assignment: learned

  tasks:
    region: true
    subregion: true
    province: true
    asr: true
    gender: true

training:
  output_dir: outputs/proposal_full
  epochs: 30
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  head_learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  mixed_precision: fp16
  early_stopping_patience: 7
  log_every: 20

loss:
  region_weight: 0.3
  subregion_weight: 0.5
  province_weight: 1.0
  asr_weight: 0.5
  gender_weight: 0.1
  hierarchy_weight: 0.1
  router_weight: 0.01
  load_balance_weight: 0.01

